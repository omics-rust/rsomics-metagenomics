name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DELIVERY_HELPER_REVISION: 46f68f15c2d0e83a71979cc5f51d105d3ddb6c01
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '4'

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      EXPECTED_HOST: ${{ matrix.host }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            arch: x86_64
            oracle: vsearch-2.31.0-linux-x86_64.tar.gz
            oracle_sha256: 1f07aec19cdeaf2a0ce8d9e3c9e6bb76a5cbf54e86d40bc50cb314a06ace2a16
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            arch: aarch64
            oracle: vsearch-2.31.0-linux-aarch64.tar.gz
            oracle_sha256: b053c0da34b48b5f05ce16268e46bc6dfe3458ab6c0ba688db786045c7e94f43
          - target: macos-x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
            arch: x86_64
            oracle: vsearch-2.31.0-macos-x86_64.tar.gz
            oracle_sha256: 57f4731a6097ba4e11c07d76c76d3ad5b08710d967cac7d887f120721fad34c1
          - target: macos-aarch64
            runner: macos-15
            host: aarch64-apple-darwin
            arch: arm64
            oracle: vsearch-2.31.0-macos-aarch64.tar.gz
            oracle_sha256: 82716dd5448ac87d12e93681579d786407198f7fbbea154d85fd2c61b3487ec5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-world
          ref: ${{ env.DELIVERY_HELPER_REVISION }}
          path: target/ci/control-plane
          sparse-checkout: scripts/native_delivery.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare runner storage
        run: |
          for pair in CARGO_HOME=cargo-home CARGO_TARGET_DIR=cargo-target RUSTUP_HOME=rustup-home TMPDIR=scratch XDG_CACHE_HOME=cache; do
            name="${pair%%=*}"
            path="$RUNNER_TEMP/${pair#*=}"
            mkdir -p "$path"
            printf '%s=%s\n' "$name" "$path" >> "$GITHUB_ENV"
          done
          mkdir -p "$RUNNER_TEMP/delivery"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - name: Verify native compiler and build target directory
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          test "$(git -C target/ci/control-plane rev-parse HEAD)" = "$DELIVERY_HELPER_REVISION"
          cargo metadata --locked --no-deps --format-version 1 | python3 -B -c 'import json,os,sys; assert json.load(sys.stdin)["target_directory"] == os.environ["CARGO_TARGET_DIR"]'
      - name: Build Kraken 2.17.1 oracle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/DerrickWood/kraken2/tar.gz/5e2aa928d00b96d61f204d517437637863da1d8c -o "$RUNNER_TEMP/kraken2-source.tar.gz"
          python3 -B - "$RUNNER_TEMP" <<'PY'
          import hashlib, pathlib, sys, tarfile
          root = pathlib.Path(sys.argv[1])
          source = root / 'kraken2-source.tar.gz'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '8cf3eeca9078d40a5d07af00dbc87a56a0c1cc11d09ee36442388a0a710052e9'
          with tarfile.open(source) as archive:
              members = archive.getmembers()
              assert len(members) == 103 and sum(m.size for m in members) < 2_000_000
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] == 'kraken2-5e2aa928d00b96d61f204d517437637863da1d8c'
                  assert member.isfile() or member.isdir()
              archive.extractall(root)
          PY
          source="$RUNNER_TEMP/kraken2-5e2aa928d00b96d61f204d517437637863da1d8c"
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install libomp
            export CXX=clang++ CC=clang
            export KRAKEN2_SKIP_FOPENMP="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
            export LDFLAGS="-L$(brew --prefix libomp)/lib -lomp"
          else
            sudo apt-get update
            sudo apt-get install --yes g++ make zlib1g-dev
          fi
          MAKEFLAGS=-j2 sh "$source/install_kraken2.sh" "$RUNNER_TEMP/kraken2-oracle"
          "$RUNNER_TEMP/kraken2-oracle/kraken2" --version | grep -Fx 'Kraken version 2.17.1'
          echo "RSOMICS_KRAKEN2_DIR=$RUNNER_TEMP/kraken2-oracle" >> "$GITHUB_ENV"
      - name: Install VSEARCH 2.31.0 oracle
        env:
          VSEARCH_ARCHIVE: ${{ matrix.oracle }}
          VSEARCH_SHA256: ${{ matrix.oracle_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$VSEARCH_ARCHIVE" \
            "https://github.com/torognes/vsearch/releases/download/v2.31.0/$VSEARCH_ARCHIVE"
          python3 - "$RUNNER_TEMP/$VSEARCH_ARCHIVE" "$VSEARCH_SHA256" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"VSEARCH checksum mismatch: {actual} != {expected}")
          PY
          tar -xzf "$RUNNER_TEMP/$VSEARCH_ARCHIVE" -C "$RUNNER_TEMP"
          oracle_dir="$RUNNER_TEMP/${VSEARCH_ARCHIVE%.tar.gz}/bin"
          echo "$oracle_dir" >> "$GITHUB_PATH"
          echo "RSOMICS_VSEARCH_BIN=$oracle_dir/vsearch" >> "$GITHUB_ENV"
      - if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all -- --check
      - if: matrix.target == 'linux-x86_64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.target == 'linux-x86_64'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: vsearch --version
      - run: cargo test --locked --all-targets --all-features
      - name: Test release
        run: |
          log="$RUNNER_TEMP/delivery/release-tests.log"
          if cargo test --release --locked --all-targets --all-features > "$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            tail -n 100 "$log" | python3 -B -c \
              'import sys; text = sys.stdin.read()[-16000:]; print("::error title=Release tests failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi

      - name: Package and verify exact source
        run: |
          delivery="$RUNNER_TEMP/delivery"
          cargo package --locked > "$delivery/package.stdout" 2> "$delivery/package.stderr" || {
            cat "$delivery/package.stdout" "$delivery/package.stderr"
            exit 1
          }
          extracted=$(python3 -B target/ci/control-plane/scripts/native_delivery.py source \
            --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" --host "$EXPECTED_HOST" --out "$delivery")
          printf 'PACKAGE_DIRECTORY=%s\n' "$extracted" >> "$GITHUB_ENV"

      - name: Install verified source and compare installed CLI
        run: |
          delivery="$RUNNER_TEMP/delivery"
          cargo install --locked --offline --path "$PACKAGE_DIRECTORY" --root "$RUNNER_TEMP/installed" \
            > "$delivery/install.stdout" 2> "$delivery/install.stderr" || {
              cat "$delivery/install.stdout" "$delivery/install.stderr"
              exit 1
            }
          python3 -B "$PACKAGE_DIRECTORY/scripts/verify_install.py" \
            --binary "$RUNNER_TEMP/installed/bin/rsomics-metagenomics" \
            --kraken-dir "$RSOMICS_KRAKEN2_DIR" --vsearch "$RSOMICS_VSEARCH_BIN" --delivery "$delivery"

      - name: Assemble native delivery candidate
        run: |
          python3 -B target/ci/control-plane/scripts/native_delivery.py bundle \
            --out "$RUNNER_TEMP/delivery" --binary "$RUNNER_TEMP/installed/bin/rsomics-metagenomics"

      - name: Retain source, installed evidence and carrier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsomics-metagenomics-delivery-${{ matrix.target }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery/*.crate
            ${{ runner.temp }}/delivery/*.tar.gz
            ${{ runner.temp }}/delivery/SOURCE.json
            ${{ runner.temp }}/delivery/SHA256SUMS
            ${{ runner.temp }}/delivery/dependency-licenses/INDEX.json
            ${{ runner.temp }}/delivery/lifecycle/
            ${{ runner.temp }}/delivery/package.std*
            ${{ runner.temp }}/delivery/install.std*
            ${{ runner.temp }}/delivery/release-tests.log
          if-no-files-found: error
          retention-days: 90

  audit-originals:
    name: Verify original delivery artifacts
    needs: native
    if: >-
      github.repository == 'omics-rust/rsomics-metagenomics' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-world
          ref: ${{ env.DELIVERY_HELPER_REVISION }}
          path: target/ci/control-plane
          sparse-checkout: |
            scripts/native_delivery.py
            scripts/audit_native_delivery.py
            scripts/stage_native_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Verify exact delivery helper
        run: test "$(git -C target/ci/control-plane rev-parse HEAD)" = "$DELIVERY_HELPER_REVISION"
      - name: Verify uploaded native ZIPs
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B target/ci/control-plane/scripts/audit_native_delivery.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/native-audit" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rsomics-metagenomics-native-audit-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-audit/AUDITED.json
          if-no-files-found: error
          retention-days: 90
      - name: Stage verified release files
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/release-stage"
          receipt=$(python3 -B target/ci/control-plane/scripts/stage_native_release.py \
            --audit "$RUNNER_TEMP/native-audit" --out "$staged")
          (cd "$staged" && sha256sum --check --strict SHA256SUMS)
          printf 'Staged receipt SHA-256: `%s`\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rsomics-metagenomics-release-stage-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-stage/
          if-no-files-found: error
          retention-days: 90
