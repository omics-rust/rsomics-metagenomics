[package]
name = "rsomics-metagenomics"
version = "0.1.0"
description = "Abundance-aware amplicon processing workflows"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-metagenomics"
homepage = "https://github.com/omics-rust/rsomics-metagenomics"
documentation = "https://docs.rs/rsomics-metagenomics"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science", "command-line-utilities"]
keywords = ["metagenomics", "amplicon", "dereplication", "fasta", "bioinformatics"]

[lib]
name = "rsomics_metagenomics"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rsomics-metagenomics"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
rsomics-common = "0.12"
rsomics-help = "0.4"
rsomics-seqio = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rayon = "1"
sha2 = "0.10"

[[bench]]
name = "amplicon"
harness = false
